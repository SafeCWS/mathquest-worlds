services:
  - type: web
    name: mathquest-worlds
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    # DELIBERATE deviation from CLAUDE.md default autoDeploy=no.
    # Manual deploy IS the bug we're fixing (stale out/ on GitHub Pages
    # caused 404s on newly-linked game modes). Starter tier is single-
    # developer scope (one family game, no prod traffic) so the
    # "pause before prod" safety isn't applicable here.
    autoDeploy: yes
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_TRUST_HOST
        value: "true"
      # Secret env vars: `sync: false` tells Render "prompt the operator
      # at service creation and never sync from the yaml." This makes
      # Render FAIL FAST if any of these are unset, instead of NextAuth
      # silently breaking at first login attempt.
      # Values fed from Keychain:
      #   security find-generic-password -a mathquest-worlds -s auth-secret -w
      #   security find-generic-password -a mathquest-worlds -s simple-auth-users-json -w
      - key: AUTH_SECRET
        sync: false
      # SIMPLE_AUTH_USERS is a JSON array of {email} objects — the family
      # allowlist for email one-time-code sign-in. Only `email` is read; a
      # `password` field, if still present, is ignored. Malformed JSON means
      # nobody can sign in (operator-approved). Change it with a GET-merge-PUT
      # (Render's env PUT is a full replacement), then redeploy.
      - key: SIMPLE_AUTH_USERS
        sync: false
      # Gmail app password for the sign-in code mail, sent from the fleet
      # SMTP user (airecruiter@). Keychain (cws-sdk, gmail-app-password).
      # Never logged. Unset => codes are not sent (a `result=skipped` log
      # line per request, and /api/health shows mailConfigured=false).
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Optional: TRUSTED_IP_HEADER = cf-connecting-ip (default when unset)
      # or x-forwarded-for-rightmost. Read the one-time `[otp] ip_source=`
      # log line before changing it. See lib/auth/otpStore.ts resolveClientIp.
